services:
    app:
        image: node:24-slim
        working_dir: /app
        volumes:
            - .:/app
            # container gets its own node_modules — tsc 7 ships platform-native
            # binaries (darwin-arm64 on host ≠ linux-arm64 in container)
            - node_modules:/app/node_modules
        # .:/app bind-mounts the repo, so the container reads the same
        # db.sqlite as bare-metal dev — no MWA_DB_PATH needed
        command: sh -c "npm ci && npm run dev"
        ports:
            - '3000:3000'
            - '3001:3001'
        environment:
            MWA_SMTP_HOST: mailpit
            MWA_SMTP_PORT: '1025'
            MWA_MAIL_FROM: mwa@localhost
        depends_on:
            mailpit:
                condition: service_started

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '1025:1025'
            - '8025:8025'
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    node_modules:
