# Production stack. Run from the repo root on the VM:
#   docker compose -f deploy/compose.prod.yaml up -d --build
# Paths resolve relative to this file's dir — '..' is the repo root.

name: mwa

services:
    app:
        build:
            context: ..
        env_file: ../.env
        volumes:
            - mwa-data:/data
            - ../backups:/backups
        restart: unless-stopped
        # no published ports — caddy reaches the app over this network
        healthcheck:
            # distroless has no PATH entry for node — the binary is /nodejs/bin/node
            test:
                - CMD
                - /nodejs/bin/node
                - -e
                - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 30s
            timeout: 5s
            retries: 3

    caddy:
        image: caddy:2-alpine
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ../Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        restart: unless-stopped
        depends_on:
            app:
                condition: service_started

volumes:
    mwa-data:
    caddy-data:
    caddy-config:
