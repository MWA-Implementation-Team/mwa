# Non-secret config — real values, committed plaintext.

domain: mwa.jetar.lt
deploy_dir: /opt/mwa

# Repo the VM clones + builds from. Private repo → the clone authenticates
# through the operator's forwarded ssh agent (see deploy/README.md).
repo_url: git@github.com:MWA-Implementation-Team/mwa-template.git
repo_ref: main

# Operators manage their own ssh keys by hand. Flip ssh_lockdown only
# after confirming everyone can still log in — it disables password auth.
ssh_lockdown: false

# SMTP — credentials live in vault.yml
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_secure: false # false = plain/STARTTLS on 587; true = implicit TLS on 465
smtp_starttls: true # require the STARTTLS upgrade — fail rather than go plaintext
mail_from: micius@mif.vusa.lt
