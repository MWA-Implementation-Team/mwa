- name: provision the mwa VM
  hosts: all
  become: true

  vars:
      # docker's apt repo names architectures differently than ansible_facts
      docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }}"

  handlers:
      - name: restart ssh
        ansible.builtin.service:
            name: ssh
            state: restarted

  tasks:
      - name: update apt cache
        tags: [base]
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600

      - name: install base packages
        tags: [base]
        ansible.builtin.apt:
            name: [ufw, git, curl, ca-certificates, cron, python3-debian]
            state: present

      - name: allow ssh, http and https inbound
        tags: [base, ufw]
        ansible.builtin.ufw:
            rule: allow
            port: '{{ item }}'
            proto: tcp
        loop: ['22', '80', '443']

      - name: deny everything else inbound, allow outbound
        tags: [base, ufw]
        ansible.builtin.ufw:
            state: enabled
            direction: '{{ item.direction }}'
            policy: '{{ item.policy }}'
        loop:
            - { direction: incoming, policy: deny }
            - { direction: outgoing, policy: allow }

      # sshd_config.d drops win over sshd_config body on cloud images —
      # a drop file, not lineinfile, is what actually takes effect.
      - name: disable ssh password auth once key login is confirmed
        tags: [base, ssh]
        ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/99-mwa.conf
            content: "PasswordAuthentication no\n"
            mode: '0644'
        when: ssh_lockdown | bool
        notify: restart ssh

      - name: create the apt keyrings dir
        tags: [docker]
        ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

      - name: add docker's gpg key
        tags: [docker]
        ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

      - name: add the docker apt repository
        tags: [docker]
        ansible.builtin.deb822_repository:
            name: docker
            types: [deb]
            uris: https://download.docker.com/linux/ubuntu
            suites: '{{ ansible_distribution_release }}'
            components: stable
            architectures: '{{ docker_apt_arch }}'
            signed_by: /etc/apt/keyrings/docker.asc
            state: present

      - name: install docker engine and the compose plugin
        tags: [docker]
        ansible.builtin.apt:
            name:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-buildx-plugin
                - docker-compose-plugin
            state: present
            update_cache: true

      - name: ensure docker is running and enabled
        tags: [docker]
        ansible.builtin.service:
            name: docker
            state: started
            enabled: true

      - name: let the operator run docker without sudo
        tags: [docker]
        ansible.builtin.user:
            name: '{{ ansible_user }}'
            groups: [docker]
            append: true

      - name: clone or update the repo
        tags: [app]
        ansible.builtin.git:
            repo: '{{ repo_url }}'
            dest: '{{ deploy_dir }}'
            version: '{{ repo_ref }}'
            accept_new_hostkey: true

      - name: render the app env file
        tags: [app]
        ansible.builtin.template:
            src: env.j2
            dest: '{{ deploy_dir }}/.env'
            mode: '0600'

      - name: render the Caddyfile
        tags: [app]
        ansible.builtin.template:
            src: Caddyfile.j2
            dest: '{{ deploy_dir }}/Caddyfile'
            mode: '0644'

      - name: build and start the stack
        tags: [app]
        community.docker.docker_compose_v2:
            project_src: '{{ deploy_dir }}/deploy'
            files: [compose.prod.yaml]
            build: always

      - name: create the backups dir
        tags: [backup]
        ansible.builtin.file:
            path: '{{ deploy_dir }}/backups'
            state: directory
            mode: '0755'

      - name: schedule the nightly sqlite backup
        tags: [backup]
        ansible.builtin.cron:
            name: mwa sqlite backup
            job: '{{ deploy_dir }}/deploy/backup.sh'
            hour: 3
            minute: 17
            user: root
